name: Check source (no deployment)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:public
      - run: npx wrangler deploy --dry-run
  audio-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile original wrapper (FFmpeg not bundled)
        shell: powershell
        run: ./tools/audio-prep/build.ps1
